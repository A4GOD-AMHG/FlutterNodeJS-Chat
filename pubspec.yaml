name: chat
description: App de chat en tiempo real con Flutter, Node.js y Socket.io.
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  http: ^1.6.0
  flutter_secure_storage: ^9.2.4
  socket_io_client: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo256x256.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
